<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
  <title id="title">Kanbaam — a little more done</title>
  <desc id="desc">Illustrated Kanbaam workflow: a task travels from To do through In progress to Done. A local-first kanban board with no account, server, or build step.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .task{animation:move-task 10s cubic-bezier(.65,0,.35,1) infinite}
    .tick{animation:complete 10s linear infinite}
    @keyframes move-task{0%,12%{transform:translate(0,0);opacity:1}32%,45%{transform:translate(0px,91px);opacity:1}66%,86%{transform:translate(0px,182px);opacity:1}92%{transform:translate(0px,182px);opacity:0}93%,100%{transform:translate(0,0);opacity:0}}
    @keyframes complete{0%,65%,92%,100%{opacity:0}68%,86%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.task,.tick{animation:none}.tick{opacity:0}}
  </style>
  <rect x="1" y="1" width="598" height="648" rx="20" fill="#f8f2f5" stroke="#e4d4de"/>
  <g fill="none" stroke="#ead5e1" stroke-width="1.5">
    <path d="M0 590C280 390 480 760 600 520"/>
    <path d="M0 601C280 401 480 771 600 531"/>
    <path d="M0 612C280 412 480 782 600 542"/>
  </g>
  <g fill="#ad304b"><rect x="32" y="35" width="8" height="24" rx="3"/><rect x="44" y="35" width="8" height="35" rx="3"/><rect x="56" y="35" width="8" height="17" rx="3"/></g>
  <text x="81" y="59" font-size="19" fill="#715e6b" letter-spacing="2">FEATURED PROJECT</text>
  <text x="29" y="135" font-size="68" font-weight="800" letter-spacing="-3" fill="#332731">kanbaam<tspan fill="#ad304b">.</tspan></text>
  <text x="32" y="183" font-size="34" font-weight="600" fill="#332731">a little more done.</text>
  <g fill="#715e6b" font-size="24">
    <text x="32" y="228">Open index.html.</text>
    <text x="260" y="228">Make room to focus.</text>
  </g>
  <g>
      <rect x="28" y="285" width="544" height="78" rx="14" fill="#fffafc" stroke="#e4d4de"/>
      <circle cx="48" cy="310" r="4" fill="#715e6b"/>
      <text x="61" y="316" fill="#332731" font-size="19" font-weight="600">To do</text>

    </g>
<g>
      <rect x="28" y="376" width="544" height="78" rx="14" fill="#fffafc" stroke="#e4d4de"/>
      <circle cx="48" cy="401" r="4" fill="#715e6b"/>
      <text x="61" y="407" fill="#332731" font-size="19" font-weight="600">In progress</text>

    </g>
<g>
      <rect x="28" y="467" width="544" height="78" rx="14" fill="#fffafc" stroke="#e4d4de"/>
      <circle cx="48" cy="492" r="4" fill="#ad304b"/>
      <text x="61" y="498" fill="#332731" font-size="19" font-weight="600">Done</text>

    </g>
  <g class="task">
    <rect x="225" y="301" width="330" height="56" rx="10" fill="#ad304b" opacity=".12"/>
    <rect x="225" y="296" width="330" height="56" rx="10" fill="#ad304b"/>
    <text x="239" y="331" font-size="23" font-weight="600" fill="#ffffff">Ship something.</text>

    <path class="tick" d="M518 331l7 7 12-14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M28 577H572" stroke="#e4d4de"/>
  <text x="32" y="607" font-size="19" fill="#332731" letter-spacing="1">LOCAL-FIRST / NO LOGIN / YOUR DATA</text>
  <text x="32" y="633" font-size="14" fill="#715e6b" letter-spacing="1">ILLUSTRATED WORKFLOW</text>
<style>.task{animation:none!important}.tick{animation:none!important;opacity:0}</style></svg>
