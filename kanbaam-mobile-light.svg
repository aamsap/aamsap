<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
  <title id="title">Kanbaam — a little more done</title>
  <desc id="desc">Illustrated Kanbaam workflow: a task travels from To do through In progress to Done. A local-first kanban board with no account, server, or build step.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .technical{font-family:Consolas,monospace}
    .task{animation:move-task 10s cubic-bezier(.65,0,.35,1) infinite}
    .tick{animation:complete 10s linear infinite}
    @keyframes move-task{0%,12%{transform:translate(0,0);opacity:1}32%,45%{transform:translate(0px,91px);opacity:1}66%,86%{transform:translate(0px,182px);opacity:1}92%{transform:translate(0px,182px);opacity:0}93%,100%{transform:translate(0,0);opacity:0}}
    @keyframes complete{0%,65%,92%,100%{opacity:0}68%,86%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.task,.tick{animation:none}.tick{opacity:0}}
  </style>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#cbd3cf" stroke-width=".7"/></pattern></defs>
  <rect width="600" height="650" fill="#e4e6e0"/>
  <rect x="16" y="16" width="568" height="618" fill="url(#grid)" stroke="#748f99"/>
  <g stroke="#182023" stroke-width="1.4" fill="none">
    <path d="M8 30H30V8M592 30H570V8M8 620H30V642M592 620H570V642"/>
  </g>
  <text class="technical" x="38" y="55" font-size="17" fill="#505e60" letter-spacing="1.5">AAMSAP / FEATURED PROJECT</text>
  <text x="34" y="135" font-size="78" font-weight="900" letter-spacing="-4" fill="#182023">KANBAAM<tspan fill="#b63327">.</tspan></text>
  <text class="technical" x="38" y="183" font-size="27" fill="#182023">A LITTLE MORE DONE.</text>
  <g fill="#505e60" font-size="24">
    <text x="32" y="228">Open index.html.</text>
    <text x="260" y="228">Make room to focus.</text>
  </g>
  <g>
      <rect x="28" y="285" width="544" height="78" fill="#e4e6e0" stroke="#748f99"/>
      <circle cx="48" cy="310" r="4" fill="#505e60"/>
      <text class="technical" x="61" y="316" fill="#182023" font-size="17" font-weight="600">TO DO</text>

    </g>
<g>
      <rect x="28" y="376" width="544" height="78" fill="#e4e6e0" stroke="#748f99"/>
      <circle cx="48" cy="401" r="4" fill="#505e60"/>
      <text class="technical" x="61" y="407" fill="#182023" font-size="17" font-weight="600">IN PROGRESS</text>

    </g>
<g>
      <rect x="28" y="467" width="544" height="78" fill="#e4e6e0" stroke="#748f99"/>
      <circle cx="48" cy="492" r="4" fill="#b63327"/>
      <text class="technical" x="61" y="498" fill="#182023" font-size="17" font-weight="600">DONE</text>

    </g>
  <g class="task">
    <rect x="225" y="296" width="330" height="56" fill="#b63327"/>
    <text x="239" y="331" font-size="23" font-weight="600" fill="#ffffff">Ship something.</text>

    <path class="tick" d="M518 331l7 7 12-14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M16 577H584" stroke="#748f99"/>
  <text class="technical" x="38" y="607" font-size="18" fill="#182023">LOCAL-FIRST / NO LOGIN / YOUR DATA</text>
  <text class="technical" x="38" y="627" font-size="13" fill="#505e60">ILLUSTRATED WORKFLOW</text>
</svg>
