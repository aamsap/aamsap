<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Kanbaam — a little more done</title>
  <desc id="desc">Illustrated Kanbaam workflow: a task travels from To do through In progress to Done. A local-first kanban board with no account, server, or build step.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .technical{font-family:Consolas,monospace}
    .task{animation:move-task 10s cubic-bezier(.65,0,.35,1) infinite}
    .tick{animation:complete 10s linear infinite}
    @keyframes move-task{0%,12%{transform:translate(0,0);opacity:1}32%,45%{transform:translate(238px,0px);opacity:1}66%,86%{transform:translate(476px,0px);opacity:1}92%{transform:translate(476px,0px);opacity:0}93%,100%{transform:translate(0,0);opacity:0}}
    @keyframes complete{0%,65%,92%,100%{opacity:0}68%,86%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.task,.tick{animation:none}.tick{opacity:0}}
  </style>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#cbd3cf" stroke-width=".7"/></pattern></defs>
  <rect width="1200" height="430" fill="#e4e6e0"/>
  <rect x="16" y="16" width="1168" height="398" fill="url(#grid)" stroke="#748f99"/>
  <g stroke="#182023" stroke-width="1.4" fill="none">
    <path d="M8 30H30V8M1192 30H1170V8M8 400H30V422M1192 400H1170V422"/>
  </g>
  <text class="technical" x="48" y="55" font-size="15" fill="#505e60" letter-spacing="1.5">AAMSAP / FEATURED PROJECT</text>
  <text x="42" y="153" font-size="66" font-weight="900" letter-spacing="-4" fill="#182023">KANBAAM<tspan fill="#b63327">.</tspan></text>
  <text class="technical" x="48" y="201" font-size="23" fill="#182023">A LITTLE MORE DONE.</text>
  <g fill="#505e60" font-size="22">
    <text x="42" y="245">Open index.html.</text>
    <text x="42" y="276">Make room to focus.</text>
  </g>
  <g>
      <rect x="430" y="74" width="220" height="246" fill="#e4e6e0" stroke="#748f99"/>
      <circle cx="450" cy="99" r="4" fill="#505e60"/>
      <text class="technical" x="463" y="105" fill="#182023" font-size="16" font-weight="600">TO DO</text>
      <rect x="446" y="220" width="188" height="73" fill="#eef0eb" stroke="#748f99"/><path d="M460 240h104m-104 15h145m-145 15h68" stroke="#748f99" stroke-width="2"/>
    </g>
<g>
      <rect x="668" y="74" width="220" height="246" fill="#e4e6e0" stroke="#748f99"/>
      <circle cx="688" cy="99" r="4" fill="#505e60"/>
      <text class="technical" x="701" y="105" fill="#182023" font-size="16" font-weight="600">IN PROGRESS</text>
      <rect x="684" y="220" width="188" height="73" fill="#eef0eb" stroke="#748f99"/><path d="M698 240h104m-104 15h145m-145 15h68" stroke="#748f99" stroke-width="2"/>
    </g>
<g>
      <rect x="906" y="74" width="220" height="246" fill="#e4e6e0" stroke="#748f99"/>
      <circle cx="926" cy="99" r="4" fill="#b63327"/>
      <text class="technical" x="939" y="105" fill="#182023" font-size="16" font-weight="600">DONE</text>
      <rect x="922" y="220" width="188" height="73" fill="#eef0eb" stroke="#748f99"/><path d="M936 240h104m-104 15h145m-145 15h68" stroke="#748f99" stroke-width="2"/>
    </g>
  <g class="task">
    <rect x="446" y="134" width="188" height="72" fill="#b63327"/>
    <text x="460" y="163" font-size="18" font-weight="600" fill="#ffffff">Ship something.</text>
    <text x="460" y="187" font-size="14" fill="#ffffff">One small step.</text>
    <path class="tick" d="M597 185l7 7 12-14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M16 357H1184M830 357V414" stroke="#748f99"/>
  <text class="technical" x="48" y="387" font-size="16" fill="#182023">LOCAL-FIRST / NO LOGIN / YOUR DATA</text>
  <text class="technical" x="855" y="387" font-size="15" fill="#505e60">ILLUSTRATED WORKFLOW</text>
<style>.task{animation:none!important}.tick{animation:none!important;opacity:0}</style></svg>
